<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira - Hamburgueria</title>
    <!-- Tailwind CSS & Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10">

    <header class="bg-red-600 text-white p-6 shadow-lg">
        <h1 class="text-3xl font-bold text-center">Dashboard da Hamburgueria</h1>
    </header>

    <main class="max-w-6xl mx-auto mt-8 px-4">
        <!-- Conexão Supabase -->
        <section class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Configurações do Supabase</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium">URL do Supabase</label>
                    <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co" class="w-full mt-1 p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium">Chave Pública (Anon Key)</label>
                    <input type="password" id="supabaseKey" placeholder="eyJhbGciOi..." class="w-full mt-1 p-2 border rounded">
                </div>
            </div>
            <button onclick="salvarCredenciaisSupabase()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Conectar Banco de Dados</button>
        </section>

        <!-- KPI Cards -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <p class="text-sm text-gray-500">Total Vendas</p>
                <h3 class="text-2xl font-bold" id="totalSales">R$ 0,00</h3>
            </div>
        </section>
    </main>

    <script>
        let supabaseClient = null;

        function inicializarSupabase() {
            const url = localStorage.getItem('sb_url');
            const key = localStorage.getItem('sb_key');
            if (url && key) {
                document.getElementById('supabaseUrl').value = url;
                document.getElementById('supabaseKey').value = key;
                supabaseClient = supabase.createClient(url, key);
                carregarDadosSupabase();
            }
        }

        function salvarCredenciaisSupabase() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            if (url && key) {
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                supabaseClient = supabase.createClient(url, key);
                alert('Conectado ao Supabase com sucesso!');
                carregarDadosSupabase();
            }
        }

        async function carregarDadosSupabase() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('custos').select('*');
            if (error) console.error('Erro ao buscar dados:', error);
            else console.log('Dados do Supabase:', data);
        }

        window.onload = inicializarSupabase;
    </script>
</body>
</html>
